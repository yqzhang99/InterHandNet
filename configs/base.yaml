# Settings shared by every backbone. Concrete experiments inherit from this file
# with `_base_`. The block layout is *not* here: it differs between the two
# backbones, so it lives in `interhandnet.yaml` (ST-GCN) and
# `interhandnet_sta_gcn.yaml` (STA-GCN), which the other configs inherit from.
seed: 1
deterministic: false
work_dir: work_dirs/base

data:
  # Archive produced by tools/extract_skeletons.py
  archive: data/handwashing_mediapipe.npz
  # One second of a 30 fps camera, matching Section IV-A.
  window_size: 30
  center: false
  batch_size: 64
  num_workers: 4

model:
  # Label set of the Lulla et al. dataset: 0 = other movement, 1..6 = WHO steps.
  # Use 6 to classify the WHO steps alone.
  num_classes: 7
  in_channels: 3
  max_hop: 2
  temporal_kernel_sizes: [5, 15]
  num_heads: 4
  dropout: 0.5
  attention_dropout: 0.1
  use_interaction_graph: true
  use_interhand_temporal_fusion: true
  use_interaction_attention: true
  interaction_graph_self_loops: false
  distance_fusion: matmul
  # `spatial` attends within each frame (original research code, cheap enough
  # for the Jetson latency budget); `spatiotemporal` attends over all
  # (frame, joint) tokens, which is the literal reading of Eq. (6)/(7).
  attention_scope: spatial
  residual: true

# Implementation details of Section IV-C.
training:
  epochs: 50
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false
  grad_clip: null
  lr_steps: []
  lr_gamma: 0.1
  best_metric: f1
  log_interval: 50

# Evaluation methodology of Section IV-B: 5-fold cross-validation per camera
# setting, split on temporal order. `gap` drops windows next to the validation
# block so that training data never sits immediately beside it.
cross_validation:
  num_folds: 5
  gap: 1
